name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The engine the suite is verified against. Local development may use a build from
  # source; this pin is what CI guarantees. Bumping it is a deliberate, reviewable change.
  FOUNDRY_VERSION: v0.1.0-alpha.19
  # The Apple toolchain the native suite is verified against, matching local development.
  # Bumping it is a deliberate, reviewable change.
  XCODE_VERSION: '26.4.1'

jobs:
  foundrylib:
    name: Foundry Script suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Foundry engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/foundry-bin
          key: foundry-${{ env.FOUNDRY_VERSION }}

      - name: Download Foundry engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/foundry-bin
          if [ ! -x ~/.cache/foundry-bin/foundry ]; then
            gh release download "$FOUNDRY_VERSION" \
              --repo cafecito-games/Foundry \
              --pattern '*_linux.x86_64.zip' \
              --output /tmp/foundry.zip
            unzip -j -o /tmp/foundry.zip -d /tmp/foundry-extract
            # The archive's executable name carries the version, so resolve it rather
            # than hard-coding it across engine bumps.
            binary=$(find /tmp/foundry-extract -maxdepth 1 -type f -name '*x86_64*' | head -1)
            [ -n "$binary" ] || { echo "no linux binary found in archive" >&2; ls -la /tmp/foundry-extract >&2; exit 1; }
            mv "$binary" ~/.cache/foundry-bin/foundry
            chmod +x ~/.cache/foundry-bin/foundry
          fi
          ~/.cache/foundry-bin/foundry --version

      - name: Install anvil
        run: go install github.com/cafecito-games/foundry-tools/cmd/anvil@latest

      - name: Run Foundry Script suite
        env:
          FOUNDRY_BIN: /home/runner/.cache/foundry-bin/foundry
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          task test:foundrylib

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install prek
        run: pip install prek

      - name: Run linters
        run: prek run --all-files

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run script checks
        run: task test:scripts

  apple:
    name: Apple native
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          developer_directory="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_directory" ]; then
            echo "Xcode $XCODE_VERSION is not installed on this runner image." >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select --switch "$developer_directory"
          xcodebuild -version
          swift --version

      - name: Install Task and XcodeGen
        run: brew install go-task xcodegen

      # Derived data carries the resolved SwiftPM checkouts and the unpacked
      # Foundry-Swift-Binary artifacts, so it is keyed on the pins and on the project
      # definition that produces the Xcode project those checkouts are resolved for.
      - name: Cache derived data and SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .build/xcodebuild/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: apple-spm-${{ env.XCODE_VERSION }}-${{ hashFiles('native/apple/FoundryKitNative/Package.resolved', 'native/apple/FoundryKitNative/project.yml') }}
          restore-keys: |
            apple-spm-${{ env.XCODE_VERSION }}-

      # No credentials: Foundry-Swift-Binary and GoogleSignIn-iOS are both public and
      # their release assets download anonymously, verified against SHA-256 checksums.
      - name: Run the Apple native suite
        run: task apple:test

      - name: Build the auth xcframework
        run: task apple:auth
