name: FoundryKitNative
options:
  bundleIdPrefix: games.cafecito.foundrykit
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  FoundrySwiftBinary:
    url: https://github.com/cafecito-games/Foundry-Swift-Binary.git
    exactVersion: 0.1.0-alpha.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.1.0
targets:
  FoundryKitCore:
    type: framework
    platform: [iOS, macOS]
    sources: [Sources/FoundryKitCore]
    settings:
      base: &frameworkSettings
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        # The install layout is addons/FoundryKit/bin/<subsystem>/<Name>.framework, with
        # FoundryKitCore.framework in bin/core/ beside the FoundrySwift package-product
        # wrapper, and FoundrySwift.framework in addons/FoundrySwift/bin/macos_arm64/.
        #
        # @loader_path is the directory holding the loaded binary, and that differs by
        # bundle shape: a shallow iOS framework puts it at <Name>.framework, a versioned
        # macOS framework two levels deeper at <Name>.framework/Versions/A. Each
        # destination therefore needs two entries. Counting from a framework in
        # bin/<subsystem>/, which is where every FoundryKit binary lives:
        #
        #   shape      to bin/                     to addons/
        #   shallow    @loader_path/../..          @loader_path/../../../..
        #   versioned  @loader_path/../../../../   @loader_path/../../../../../..
        #
        # A binary loaded straight out of an xcframework sits two levels deeper again
        # (<Name>.xcframework/<slice>/), so each shape needs a second pair. The shallow
        # in-xcframework depth coincides with the versioned flat depth, which is why the
        # list is six entries and not eight.
        #
        # An entry that does not resolve is skipped by dyld, so a shape that does not
        # apply costs nothing. @executable_path/Frameworks covers the iOS case where the
        # frameworks are embedded in the host .app instead.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks @loader_path/../../core @loader_path/../../../../core @loader_path/../../../../../../core @loader_path/../../../../FoundrySwift/bin/macos_arm64 @loader_path/../../../../../../FoundrySwift/bin/macos_arm64 @loader_path/../../../../../../../../FoundrySwift/bin/macos_arm64"
        # Foundry-Swift-Binary 0.1.0-alpha.2 has two packaging defects that make these
        # flags mandatory; both are tracked upstream as FoundryKit#81.
        #
        # 1. FoundrySwiftMacros.artifactbundle declares "type": "executable" in its
        #    info.json, so SwiftPM never registers it as a macro plugin. Without
        #    -load-plugin-executable, every @Foundry / @Signal / @Callable and
        #    #initFoundryExtension fails to expand.
        # 2. FoundrySwift.xcframework ships no binary .swiftmodule, only a
        #    .swiftinterface whose first import is the private FoundryExtensionC
        #    module. Rebuilding from the interface drops the module map the original
        #    compilation had, so the interface needs FoundryExtensionC on the Swift
        #    import search path: the checkout's public headers, plus the module map
        #    Xcode generates for that C target while building the package.
        #
        # Both paths are derived from build settings so that no triple, configuration
        # or derived-data location is baked in.
        FOUNDRY_SWIFT_CHECKOUT: $(BUILD_DIR)/../../SourcePackages/checkouts/Foundry-Swift-Binary
        FOUNDRY_EXTENSION_C_MODULE_DIR: $(BUILD_DIR)/../Intermediates.noindex/FoundrySwiftBinary.build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/FoundryExtensionC.build
        OTHER_SWIFT_FLAGS: -load-plugin-executable $(FOUNDRY_SWIFT_CHECKOUT)/Binaries/FoundrySwiftMacros.artifactbundle/FoundrySwiftMacroLibrary-macos/bin/FoundrySwiftMacroLibrary#FoundrySwiftMacroLibrary -I $(FOUNDRY_SWIFT_CHECKOUT)/Sources/FoundryExtension/include -I $(FOUNDRY_EXTENSION_C_MODULE_DIR)
    dependencies:
      - package: FoundrySwiftBinary
        product: FoundrySwift
  FoundryKitAuth:
    type: framework
    platform: [iOS, macOS]
    sources: [Sources/FoundryKitAuth]
    settings:
      base: *frameworkSettings
    dependencies:
      - target: FoundryKitCore_${platform}
      - package: FoundrySwiftBinary
        product: FoundrySwift
      - package: GoogleSignIn
        product: GoogleSignIn
  FoundryKitCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FoundryKitCoreTests]
    settings:
      base: &testSettings
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FoundryKitCore_macOS
  FoundryKitAuthTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FoundryKitAuthTests]
    settings:
      base: *testSettings
    dependencies:
      - target: FoundryKitAuth_macOS
      - package: GoogleSignIn
        product: GoogleSignIn
schemes:
  FoundryKitAuth_iOS:
    build:
      targets:
        FoundryKitAuth_iOS: all
  FoundryKitAuth_macOS:
    build:
      targets:
        FoundryKitAuth_macOS: all
        FoundryKitCoreTests: [test]
        FoundryKitAuthTests: [test]
    test:
      targets:
        - FoundryKitCoreTests
        - FoundryKitAuthTests
